# SPDX-License-Identifier: Apache-2.0
#
# Local development packaging for the Ubuntu Touch frontend.
#
# CI does not use Clickable: it stages the same directory layout with plain
# Docker and runs "click build" itself (see .github/workflows/ubuntu-touch.yml).
# Keep both in sync â€” in particular the binary name/path (usr/bin/localsend),
# which localsend.desktop ("Exec=usr/bin/localsend") depends on.

clickable_minimum_required: 8.0.0

# Ubuntu Touch 24.04 ships Qt 5.15, which also selects the 24.04 SDK images.
# Must stay in sync with "framework" in manifest.json.
qt_version: "5.15"

builder: rust

# Clickable's rust builder runs "cargo install", so the binary lands in
# lib/<triplet>/bin/localsend-ubuntu-touch. localsend.desktop
# ("Exec=usr/bin/localsend") and the CI staging both expect usr/bin/localsend,
# so move it there (same file, no duplicate copy in the click).
postbuild:
  - |
    set -euo pipefail
    install -Dm755 "$INSTALL_DIR/lib/$ARCH_TRIPLET/bin/localsend-ubuntu-touch" "$INSTALL_DIR/usr/bin/localsend"
    rm -f "$INSTALL_DIR/lib/$ARCH_TRIPLET/bin/localsend-ubuntu-touch"

# Everything below is copied into the click root. QML and the logo are also
# embedded in the binary (see src/resources.rs), but shipping them keeps the
# click inspectable and byte-comparable with the CI artifacts.
install_root_data:
  - "manifest.json"
  - "localsend.desktop"
  - "localsend-contenthub.json"
  - "apparmor"
  - "assets"
  - "assets/logo.png"
  - "qml"

# "clickable launch" runs pkill -f with this pattern before starting the app.
# The install path of a click contains the app id, so this only matches our app.
kill: "localsend.ahmadabdelbary"

dependencies_target:
  - build-essential
  - pkg-config
  - libssl-dev
  - qtbase5-dev
  - qtdeclarative5-dev
