clickable_minimum_required: 8.0.0

builder: custom

build:
  - bash -c 'set -euo pipefail
      && export CARGO_HOME=/opt/rust/cargo
      && export RUSTUP_HOME=/opt/rust/rustup
      && export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
      && echo "cargo: $(command -v cargo)"
      && cargo --version
      && rustup --version
      && case "$ARCH" in
           arm64) RT=aarch64-unknown-linux-gnu ;;
           armhf) RT=armv7-unknown-linux-gnueabihf ;;
           amd64) RT=x86_64-unknown-linux-gnu ;;
           *) echo "bad ARCH: $ARCH" >&2; exit 1 ;;
         esac
      && rustup target add "$RT"
      && cargo build --release --target "$RT"
      && mkdir -p "$INSTALL_DIR/usr/bin" "$INSTALL_DIR/apparmor" "$INSTALL_DIR/qml" "$INSTALL_DIR/assets"
      && cp "target/$RT/release/localsend-ubuntu-touch" "$INSTALL_DIR/usr/bin/"
      && cp apparmor/localsend-ubuntu-touch.apparmor "$INSTALL_DIR/apparmor/"
      && cp localsend-ubuntu-touch.desktop "$INSTALL_DIR/"
      && cp -r qml/* "$INSTALL_DIR/qml/"
      && (cp -r assets/* "$INSTALL_DIR/assets/" 2>/dev/null || true)
      && echo "=== staged ==="
      && ls -la "$INSTALL_DIR/usr/bin/"
      '

kill: localsend-ubuntu-touch

dependencies_target:
  - qtbase5-dev
  - qtdeclarative5-dev
  - qtdeclarative5-dev-tools
  - qml-module-qtquick2
  - qml-module-qtquick-controls2
  - qml-module-qtquick-layouts
  - qml-module-qtquick-window2
  - qml-module-qtqml-workerscript2
  - qml-module-lomiri-components
  - qml-module-lomiri-components-extras
  - qml-module-lomiri-content
  - qml-module-lomiri-content-doc
  - liblomiri-connectivity-qt1-1
  - lomiri-components
  - lomiri-components-extras