clickable_minimum_required: 8.0.0

builder: custom
build:
  - cargo build --release --target aarch64-unknown-linux-gnu
  - mkdir -p ${INSTALL_DIR}/bin
  - cp target/aarch64-unknown-linux-gnu/release/localsend-ubuntu-touch ${INSTALL_DIR}/bin/
  - mkdir -p ${INSTALL_DIR}/qml
  - cp -r qml/* ${INSTALL_DIR}/qml/ 2>/dev/null || true

install_dir: ${INSTALL_DIR}

kill: localsend-ubuntu-touch

dependencies_host:
  - qt6-base-dev
  - qt6-declarative-dev

dependencies_target:
  - qt6-base-dev
  - qt6-declarative-dev
  - qt6-declarative-dev-tools
  - qml6-module-qtquick
  - qml6-module-qtquick-controls
  - qml6-module-qtquick-layouts
  - qml6-module-qtquick-window
  - qml6-module-qtqml-workerscript
  - liblomiri-connectivity-qt1-1
  - lomiri-components
  - lomiri-components-extras
  - qml-module-lomiri-components
  - qml-module-lomiri-components-extras

app: localsend-ubuntu-touch