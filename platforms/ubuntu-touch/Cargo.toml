[package]
name = "localsend-ubuntu-touch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Ubuntu Touch frontend for LocalSend (QML + Rust)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "localsend-ubuntu-touch"
path = "src/main.rs"

[dependencies]
qmetaobject = "0.2"
cstr = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

log = "0.4"
env_logger = "0.11"
