[package]
name = "localsend-ubuntu-touch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Ubuntu Touch frontend for LocalSend (QML + Rust)"
license = "Apache-2.0"
publish = false

[lib]
name = "localsend_ubuntu_touch"
path = "src/lib.rs"

[[bin]]
name = "localsend-ubuntu-touch"
path = "src/main.rs"

[dependencies]
qmetaobject = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Network interface enumeration (also used by core, but we need it directly).
if-addrs = "0.15"

log = "0.4"
env_logger = "0.11"

# Shared LocalSend core.
# Features: http (server + protocol), crypto (TLS/fingerprint).
# `discovery`/`multicast`/`webrtc` will be enabled later as needed.
localsend = { path = "../../packages/core", features = ["http"] }