[package]
name = "localsend-ubuntu-touch"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "Native Ubuntu Touch frontend for LocalSend (QML + Rust)"
license = "Apache-2.0"
publish = false

[lib]
name = "localsend_ubuntu_touch"
path = "src/lib.rs"

[[bin]]
name = "localsend-ubuntu-touch"
path = "src/main.rs"

[dependencies]
qmetaobject = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
bytes = "1"

# Bridge core's tracing logs into the log facade,
# so env_logger can print them.
tracing = "0.1"
tracing-log = "0.2"

localsend = { path = "../../packages/core", features = ["discovery"] }
