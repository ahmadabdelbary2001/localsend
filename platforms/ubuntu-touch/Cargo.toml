[package]
name = "localsend-ubuntu-touch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Ubuntu Touch frontend for LocalSend (QML + Rust)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "localsend-ubuntu-touch"
path = "src/main.rs"

[dependencies]
# QML/Qt bindings. qmetaobject-rs 0.26 defaults to Qt 5;
# do NOT enable the `qt_6` feature on Ubuntu Touch.
qmetaobject = "0.26"
cstr = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

log = "0.4"
env_logger = "0.11"

# TODO: connect to existing LocalSend core API.
# Replace with the real crate name from packages/core/Cargo.toml.
# localsend-core = { path = "../../packages/core" }