name: ubuntu-touch

run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || format('CI · {0}', github.ref_name) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "platforms/ubuntu-touch/**"
      - "packages/core/**"
      - ".github/workflows/ubuntu-touch.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cargo_checks:
    name: Rust checks (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Qt5 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libssl-dev pkg-config

      - name: cargo check
        run: cargo check -p localsend-ubuntu-touch --all-targets

      - name: cargo test
        run: cargo test -p localsend-ubuntu-touch --lib

  ubuntu_touch:
    name: Click · ${{ matrix.arch }}
    needs: [cargo_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-arm64
          - arch: armhf
            rust_target: armv7-unknown-linux-gnueabihf
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-armhf
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-amd64

    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      SDK_IMAGE: ${{ matrix.sdk_image }}
      PROVISIONED_IMAGE: localsend-ut-sdk:24.04-1.x-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: v
        run: |
          set -euo pipefail
          V="$(python3 -c 'import json; print(json.load(open("platforms/ubuntu-touch/manifest.json"))["version"])')"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$V" >> "$GITHUB_ENV"

      - name: Provision SDK image
        run: |
          set -euxo pipefail
          docker pull "$SDK_IMAGE"
          docker run -d --name ut-sdk "$SDK_IMAGE" sleep infinity

          docker exec ut-sdk bash -lc '
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
              libc6-dev-arm64-cross libc6-dev-armhf-cross \
              libssl-dev qtbase5-dev qtdeclarative5-dev click file

            export CARGO_HOME=/opt/rust/cargo
            export RUSTUP_HOME=/opt/rust/rustup
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup target add aarch64-unknown-linux-gnu
            rustup target add armv7-unknown-linux-gnueabihf
            rustup target add x86_64-unknown-linux-gnu

            cat > "$CARGO_HOME/config.toml" <<CONFIG
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          CONFIG
          '
          docker commit ut-sdk "$PROVISIONED_IMAGE"
          docker rm -f ut-sdk

      - name: Build + assemble + package
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            -e ARCH="$ARCH" \
            -e RUST_TARGET="$RUST_TARGET" \
            "$PROVISIONED_IMAGE" \
            bash -c 'set -euxo pipefail
          export CARGO_HOME=/opt/rust/cargo
          export RUSTUP_HOME=/opt/rust/rustup
          export PATH="$CARGO_HOME/bin:$PATH"

          rustup target add "$RUST_TARGET"
          cargo build --release --target "$RUST_TARGET" -p localsend-ubuntu-touch

          BIN="/src/target/${RUST_TARGET}/release/localsend-ubuntu-touch"
          test -x "$BIN"

          ROOT=/tmp/click-root
          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr/bin" "$ROOT/apparmor" "$ROOT/qml" "$ROOT/assets"

          sed "s/\"architecture\": \"[^\"]*\"/\"architecture\": \"$ARCH\"/" /src/platforms/ubuntu-touch/manifest.json > "$ROOT/manifest.json"
          cp /src/platforms/ubuntu-touch/localsend-ubuntu-touch.desktop "$ROOT/"
          cp /src/platforms/ubuntu-touch/apparmor/localsend-ubuntu-touch.apparmor "$ROOT/apparmor/"
          cp "$BIN" "$ROOT/usr/bin/"
          cp -r /src/platforms/ubuntu-touch/qml/. "$ROOT/qml/"
          cp -r /src/platforms/ubuntu-touch/assets/. "$ROOT/assets/"

          find "$ROOT" -type f | sort

          mkdir -p /src/dist
          cd /tmp
          click build "$ROOT"
          mv /tmp/*.click /src/dist/
          ls -la /src/dist/'

          CLICK_OUT="$(find dist -type f -name "*_${EXPECTED_VERSION}_${ARCH}.click" -print -quit)"
          test -n "$CLICK_OUT"
          test -f "$CLICK_OUT"
          echo "CLICK_OUT=$CLICK_OUT" >> "$GITHUB_ENV"
          ls -lh "$CLICK_OUT"

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends click

      - name: Validate click
        run: |
          set -euxo pipefail
          click info "$CLICK_OUT" > /tmp/info.json
          cat /tmp/info.json

          rm -rf /tmp/pk && mkdir -p /tmp/pk
          dpkg-deb -x "$CLICK_OUT" /tmp/pk

          test -f /tmp/pk/usr/bin/localsend-ubuntu-touch
          test -f /tmp/pk/localsend-ubuntu-touch.desktop
          test -f /tmp/pk/apparmor/localsend-ubuntu-touch.apparmor
          test -f /tmp/pk/assets/logo.png

          python3 -c "import json; m=json.load(open('/tmp/info.json')); assert m['architecture']=='$ARCH', m; assert m['version']=='$EXPECTED_VERSION', m; print('click validation OK')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-ut-${{ matrix.arch }}
          path: ${{ env.CLICK_OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to OpenStore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
        run: |
          set -euxo pipefail
          test -n "${OPENSTORE_API_KEY:-}" || { echo "::error::OPENSTORE_API_KEY missing"; exit 1; }
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${OPENSTORE_API_KEY}" \
            -F "file=@${CLICK_OUT}" \
            -F "changelog=Release ${GITHUB_REF_NAME} (${ARCH})" \
            "https://open-store.io/api/v3/manage/localsend.ahmadabdelbary/releases"
