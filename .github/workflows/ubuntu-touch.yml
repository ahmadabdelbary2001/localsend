name: ubuntu-touch

run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || format('CI · {0}', github.ref_name) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "platforms/ubuntu-touch/**"
      - "packages/core/**"
      - ".github/workflows/ubuntu-touch.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLICKABLE_VERSION: "8.10.0"

jobs:
  cargo_checks:
    name: Rust checks (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libssl-dev pkg-config

      - name: cargo check
        run: cargo check -p localsend-ubuntu-touch --all-targets

      - name: cargo test
        run: cargo test -p localsend-ubuntu-touch --lib

  ubuntu_touch:
    name: Click · ${{ matrix.arch }}
    needs: [cargo_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-arm64
          - arch: armhf
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-armhf
          - arch: amd64
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-amd64

    env:
      ARCH: ${{ matrix.arch }}
      SDK_IMAGE: ${{ matrix.sdk_image }}
      PROVISIONED_IMAGE: localsend-ut-sdk:24.04-1.x-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("platforms/ubuntu-touch/manifest.json"))["version"])')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Clickable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip click file
          python3 -m pip install --break-system-packages "clickable-ut==${CLICKABLE_VERSION}"

      - name: Provision SDK image
        run: |
          set -euxo pipefail
          docker pull "$SDK_IMAGE"
          docker run -d --name ut-sdk "$SDK_IMAGE" sleep infinity

          docker exec ut-sdk bash -lc '
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
              libc6-dev-arm64-cross libc6-dev-armhf-cross \
              libssl-dev \
              qtbase5-dev qtdeclarative5-dev

            export CARGO_HOME=/opt/rust/cargo
            export RUSTUP_HOME=/opt/rust/rustup
            export PATH="$CARGO_HOME/bin:$PATH"

            rustup target add aarch64-unknown-linux-gnu
            rustup target add armv7-unknown-linux-gnueabihf
            rustup target add x86_64-unknown-linux-gnu

            cat > "$CARGO_HOME/config.toml" <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          EOF
          '

          docker commit ut-sdk "$PROVISIONED_IMAGE"
          docker rm -f ut-sdk

      - name: Build Rust binary (full repo mounted)
        run: |
          set -euxo pipefail

          case "$ARCH" in
            arm64) RUST_TARGET=aarch64-unknown-linux-gnu ;;
            armhf) RUST_TARGET=armv7-unknown-linux-gnueabihf ;;
            amd64) RUST_TARGET=x86_64-unknown-linux-gnu ;;
          esac
          echo "RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            -e RUST_TARGET="$RUST_TARGET" \
            "$PROVISIONED_IMAGE" \
            bash -c '
              set -euxo pipefail
              export CARGO_HOME=/opt/rust/cargo
              export RUSTUP_HOME=/opt/rust/rustup
              export PATH="$CARGO_HOME/bin:$PATH"

              rustup target add "$RUST_TARGET"

              cargo build --release \
                --target "$RUST_TARGET" \
                -p localsend-ubuntu-touch
            '

          mkdir -p platforms/ubuntu-touch/prebuilt
          cp "target/${RUST_TARGET}/release/localsend-ubuntu-touch" \
             platforms/ubuntu-touch/prebuilt/
          ls -la platforms/ubuntu-touch/prebuilt/

      - name: Build click
        env:
          CLICKABLE_DOCKER_COMMAND: docker
          CLICKABLE_NON_INTERACTIVE: "1"
        run: |
          set -euxo pipefail
          cd platforms/ubuntu-touch

          clickable build \
            --arch "$ARCH" \
            --docker-image "$PROVISIONED_IMAGE" \
            --skip-image-setup

          CLICK_OUT="$(find build -type f -name "*_${EXPECTED_VERSION}_${ARCH}.click" -print -quit)"
          test -n "$CLICK_OUT"
          test -f "$CLICK_OUT"
          echo "CLICK_OUT=$CLICK_OUT" >> "$GITHUB_ENV"
          ls -lh "$CLICK_OUT"

      - name: Validate click
        run: |
          set -euxo pipefail
          click info "$CLICK_OUT" > /tmp/info.json
          cat /tmp/info.json

          rm -rf /tmp/pk && mkdir -p /tmp/pk
          dpkg-deb -x "$CLICK_OUT" /tmp/pk

          test -f /tmp/pk/usr/bin/localsend-ubuntu-touch
          test -f /tmp/pk/localsend-ubuntu-touch.desktop
          test -f /tmp/pk/apparmor/localsend-ubuntu-touch.apparmor
          echo "package validation OK"

      - name: Upload click artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-ut-${{ matrix.arch }}
          path: ${{ env.CLICK_OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to OpenStore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          CLICKABLE_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          test -n "${OPENSTORE_API_KEY:-}" || { echo "::error::OPENSTORE_API_KEY missing"; exit 1; }
          cd platforms/ubuntu-touch
          clickable publish --arch "$ARCH" "Release ${GITHUB_REF_NAME}"
