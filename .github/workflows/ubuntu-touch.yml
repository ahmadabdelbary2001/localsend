name: ubuntu-touch

run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v') && format('Release Â· {0}', github.ref_name) || format('CI Â· {0}', github.ref_name) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "platforms/ubuntu-touch/**"
      - "packages/core/**"
      - ".github/workflows/ubuntu-touch.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo_checks:
    name: Rust checks (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Qt5 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev libssl-dev pkg-config

      - name: cargo check
        run: cargo check -p localsend-ubuntu-touch --all-targets

      - name: cargo test
        run: cargo test -p localsend-ubuntu-touch --lib

  ubuntu_touch:
    name: Click Â· ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-arm64
          - arch: armhf
            rust_target: armv7-unknown-linux-gnueabihf
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-armhf
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            sdk_image: docker.io/clickable/ci-ut24.04-1.x-amd64

    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      SDK_IMAGE: ${{ matrix.sdk_image }}
      PROVISIONED_IMAGE: localsend-ut-sdk:24.04-1.x-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: v
        run: |
          set -euo pipefail
          V="$(python3 -c 'import json; print(json.load(open("platforms/ubuntu-touch/manifest.json"))["version"])')"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$V" >> "$GITHUB_ENV"

      - name: Verify tag matches manifest version (release gate)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euxo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $EXPECTED_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $EXPECTED_VERSION"

      - name: Provision SDK image
        run: |
          set -euxo pipefail
          docker pull "$SDK_IMAGE"
          docker run -d --name ut-sdk "$SDK_IMAGE" sleep infinity

          docker exec -e ARCH="$ARCH" ut-sdk bash -lc '
            set -eux
            export DEBIAN_FRONTEND=noninteractive

            # Retry transient repository errors, including HTTP 503 responses.
            apt-get update \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30

            apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
              libc6-dev-arm64-cross libc6-dev-armhf-cross \
              libssl-dev \
              qtbase5-dev qtdeclarative5-dev \
              click click-apparmor file click-reviewers-tools \
              apparmor apparmor-utils apparmor-profiles \
              python3-apparmor python3-libapparmor \
              apparmor-easyprof apparmor-easyprof-ubuntu

            export CARGO_HOME=/opt/rust/cargo
            export RUSTUP_HOME=/opt/rust/rustup
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup target add aarch64-unknown-linux-gnu
            rustup target add armv7-unknown-linux-gnueabihf
            rustup target add x86_64-unknown-linux-gnu

            cat > "$CARGO_HOME/config.toml" <<CONFIG
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          CONFIG
          '
          docker commit ut-sdk "$PROVISIONED_IMAGE"
          docker rm -f ut-sdk

      - name: Reject invalid import statements
        run: |
          set -euo pipefail
          cd platforms/ubuntu-touch

          # 'import "foo.qml"' means "find a module/directory named foo.qml",
          # which never exists. QML supports file imports only for .js files.
          # Such a line compiles fine (qmllint accepts it) but breaks
          # loading at runtime, hanging the app on the Lomiri splash.
          if grep -rEn '^[[:space:]]*import[[:space:]]+"[^"]+\.qml"' qml/; then
            echo "::error::Found a .qml file import. QML components in the same directory do not need an import; remove the line."
            exit 1
          fi
          echo "import statements OK"

      - name: Reject QML properties missing on Lomiri components
        run: |
          set -euo pipefail
          cd platforms/ubuntu-touch

          # Lomiri.Components overrides several QtQuick.Controls types,
          # and the override drops signals/properties like 'editingFinished'.
          # These classes of mistake compile but fail at load time.
          BAD="onEditingFinished"
          if grep -rEn "$BAD" qml/; then
            echo "::error::Lomiri TextField has no editingFinished. Use a Timer (see SettingsTextField.qml)."
            exit 1
          fi
          echo "Lomiri compatibility grep OK"

      - name: Reject nested QtObject inside readonly property
        run: |
          set -euo pipefail
          cd platforms/ubuntu-touch

          # Qt 5.15 does not reliably materialize an inline QtObject
          # assigned to a readonly property, so 'colors'/'metrics' end
          # up undefined. Use JS object literals instead.
          if grep -rEn 'readonly[[:space:]]+property[[:space:]]+QtObject[[:space:]]+[A-Za-z_]+[[:space:]]*:[[:space:]]*QtObject[[:space:]]*\{' qml/; then
            echo "::error::Inline QtObject in readonly property is unreliable on Qt 5.15. Use a JS object literal ('readonly property var x: ({ ... })')."
            exit 1
          fi
          echo "nested QtObject grep OK"

      - name: Verify QML files are embedded in the binary
        run: |
          set -euo pipefail
          cd platforms/ubuntu-touch

          # QML is loaded from qrc:/qml/..., so every runtime file must be
          # listed in src/resources.rs. A missing entry compiles fine but
          # makes the app fail with "<Type> is not a type" at startup.
          MISSING=0
          while read -r f; do
            [ "$(basename "$f")" = ".gitkeep" ] && continue
            if ! grep -q "\"$f\"" src/resources.rs; then
              echo "::error::$f is not registered in src/resources.rs; it will not exist at runtime."
              MISSING=1
            fi
          done < <(find qml -type f | sort)
          [ "$MISSING" -eq 0 ] || exit 1
          echo "qrc registration OK"

      - name: Verify QML imports resolve
        run: |
          set -euo pipefail
          cd platforms/ubuntu-touch

          # For every 'import "..."' in a QML file, the target must be
          # an existing directory (or .js). Otherwise the referring
          # file compiles but cannot find the types at runtime.
          FAILED=0
          while IFS=: read -r file lineno line; do
            # extract the path between quotes
            rel="$(echo "$line" | sed -n 's/.*import[[:space:]]*"\([^"]*\)".*/\1/p')"
            [ -z "$rel" ] && continue
            # .js files are legitimate file imports
            case "$rel" in *.js) continue ;; esac
            dir="$(dirname "$file")/$rel"
            if [ ! -d "$dir" ]; then
              echo "::error file=$file,line=$lineno::import target does not exist: $rel (resolved to $dir)"
              FAILED=1
            fi
          done < <(grep -rEn '^[[:space:]]*import[[:space:]]+"[^"]+"' qml/ || true)

          exit $FAILED

      - name: Lint QML sources
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src/platforms/ubuntu-touch \
            "$PROVISIONED_IMAGE" \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get install -y --no-install-recommends qtdeclarative5-dev-tools >/dev/null

              # qmllint is strict about missing context. Ignore
              # "unqualified" errors caused by C++-registered types
              # (translator, serverController, etc.) which only exist
              # at runtime.
              FAILED=0
              for f in $(find qml -name "*.qml"); do
                echo "--- $f"
                qmllint "$f" 2>&1 | \
                  grep -v "Unqualified access" | \
                  grep -v "Cannot find property" | \
                  grep -v "^$" > /tmp/lint.txt || true
                if [ -s /tmp/lint.txt ]; then
                  cat /tmp/lint.txt
                  FAILED=1
                fi
              done
              exit $FAILED
            '

      - name: Build + assemble + package
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            -e ARCH="$ARCH" \
            -e RUST_TARGET="$RUST_TARGET" \
            "$PROVISIONED_IMAGE" \
            bash -c 'set -euxo pipefail
          export CARGO_HOME=/opt/rust/cargo
          export RUSTUP_HOME=/opt/rust/rustup
          export PATH="$CARGO_HOME/bin:$PATH"

          rustup target add "$RUST_TARGET"
          cargo build --release --target "$RUST_TARGET" -p localsend-ubuntu-touch

          BIN="/src/target/${RUST_TARGET}/release/localsend-ubuntu-touch"
          test -x "$BIN"

          ROOT=/tmp/click-root
          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr/bin" "$ROOT/apparmor" "$ROOT/qml" "$ROOT/assets"

          sed "s/\"architecture\": \"[^\"]*\"/\"architecture\": \"$ARCH\"/" /src/platforms/ubuntu-touch/manifest.json > "$ROOT/manifest.json"
          cp /src/platforms/ubuntu-touch/localsend.desktop "$ROOT/"
          cp /src/platforms/ubuntu-touch/localsend-contenthub.json "$ROOT/"
          cp /src/platforms/ubuntu-touch/apparmor/localsend.apparmor "$ROOT/apparmor/"
          cp "$BIN" "$ROOT/usr/bin/localsend"
          cp -r /src/platforms/ubuntu-touch/qml/. "$ROOT/qml/"
          cp -r /src/platforms/ubuntu-touch/assets/. "$ROOT/assets/"
          cp /src/platforms/ubuntu-touch/assets/logo.png "$ROOT/logo.png"

          find "$ROOT" -type f | sort

          mkdir -p /src/dist
          cd /tmp
          click build "$ROOT"
          CLICK_FILE="$(find /tmp -maxdepth 1 -type f -name "localsend.ahmadabdelbary_*.click" -print -quit)"
          test -n "$CLICK_FILE"
          # Common policy groups only: redflagged path permissions block release.
          review_status=0
          click-review "$CLICK_FILE" 2>&1 | tee /tmp/click-review.log || review_status=$?
          if grep -Eiq "ERROR:|Could not load|Traceback|FATAL" /tmp/click-review.log; then
            echo "::error::click-review reported a package error" >&2
            cat /tmp/click-review.log
            exit 1
          fi
          if grep -Eiq "found redflagged fields|redflagged fields" /tmp/click-review.log; then
            echo "::error::click-review found redflagged AppArmor fields; refusing to publish this package" >&2
            cat /tmp/click-review.log
            exit 1
          fi
          if [ "$review_status" -ne 0 ]; then
            echo "::error::click-review exited $review_status" >&2
            cat /tmp/click-review.log
            exit "$review_status"
          fi
          mv "$CLICK_FILE" /src/dist/
          ls -la /src/dist/'

          CLICK_OUT="$(find dist -type f -name "*_${EXPECTED_VERSION}_${ARCH}.click" -print -quit)"
          test -n "$CLICK_OUT"
          test -f "$CLICK_OUT"
          echo "CLICK_OUT=$CLICK_OUT" >> "$GITHUB_ENV"
          ls -lh "$CLICK_OUT"

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends click

      - name: Validate click
        run: |
          set -euxo pipefail
          click info "$CLICK_OUT" > /tmp/info.json
          cat /tmp/info.json

          rm -rf /tmp/pk && mkdir -p /tmp/pk
          dpkg-deb -x "$CLICK_OUT" /tmp/pk

          test -f /tmp/pk/usr/bin/localsend
          test -f /tmp/pk/localsend.desktop
          test -f /tmp/pk/localsend-contenthub.json
          python3 -m json.tool /tmp/pk/localsend-contenthub.json > /dev/null
          test -f /tmp/pk/apparmor/localsend.apparmor
          test -f /tmp/pk/assets/logo.png
          test -f /tmp/pk/logo.png

          # Disallow AppArmor fields that trigger manual review.
          python3 -c "import json; p=json.load(open('/tmp/pk/apparmor/localsend.apparmor')); bad=[k for k in ('abstractions','read_path','write_path','template','policy_vendor') if k in p]; assert not bad, {'redflagged_fields': bad, 'policy': p}; groups=p.get('policy_groups', []); assert 'networking' in groups and 'content_exchange' in groups and 'content_exchange_source' in groups, p; print('apparmor policy OK: no redflagged fields')"

          python3 -c "import json; m=json.load(open('/tmp/info.json')); assert m['architecture']=='$ARCH', m; assert m['version']=='$EXPECTED_VERSION', m; print('click validation OK')"

      - name: Upload Rust binary for OpenStore publication
        uses: actions/upload-artifact@v4
        with:
          name: localsend-bin-${{ matrix.arch }}
          path: target/${{ env.RUST_TARGET }}/release/localsend-ubuntu-touch
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-ut-${{ matrix.arch }}
          path: ${{ env.CLICK_OUT }}
          if-no-files-found: error
          retention-days: 30


  release:
    name: Publish GitHub Release
    needs: [ubuntu_touch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all click artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: localsend-ut-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          CLICKS=(dist/*.click)
          test "${#CLICKS[@]}" -gt 0 || { echo "no .click artifacts"; exit 1; }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${CLICKS[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${CLICKS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LocalSend for Ubuntu Touch $TAG" \
              --notes "Native Ubuntu Touch build of LocalSend.

          ### What's included

          - **Receive**: automatic and manual accept; export received files through Content Hub to shared storage
          - **Send**: pick files and send to nearby devices, app picker for `.click` / `.apk`
          - **Discovery**: multicast + HTTP register
          - **Content Hub**: received files are handed to the file manager, one save request per transfer

          ### Requirements

          - Ubuntu Touch 24.04 (framework 24.04-1.x)
          - arm64, armhf, or amd64 device"
          fi

  publish_openstore:
    name: Publish to OpenStore Â· ${{ matrix.arch }}
    needs: [ubuntu_touch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - arch: arm64
          - arch: armhf
          - arch: amd64

    env:
      OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
      APP_ID: localsend.ahmadabdelbary

    steps:
      - name: Checkout (for manifest version)
        uses: actions/checkout@v4

      - name: Verify API key and version
        run: |
          set -euo pipefail
          test -n "${OPENSTORE_API_KEY:-}" || {
            echo "::error::OPENSTORE_API_KEY is not configured"
            exit 1
          }
          VERSION="$(python3 -c 'import json; print(json.load(open("platforms/ubuntu-touch/manifest.json"))["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG_VERSION" || {
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download built click
        uses: actions/download-artifact@v4
        with:
          name: localsend-ut-${{ matrix.arch }}
          path: dist

      - name: Locate click
        run: |
          set -euxo pipefail
          ls -la dist/
          CLICK="$(find dist -type f -name "*_${{ matrix.arch }}.click" -print -quit)"
          test -n "$CLICK" || { echo "::error::no .click found"; exit 1; }
          echo "CLICK=$CLICK" >> "$GITHUB_ENV"
          ls -lh "$CLICK"

      - name: Publish to OpenStore
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          APP_ID: localsend.ahmadabdelbary
        run: |
          set -euo pipefail

          echo "Publishing ${CLICK} (${VERSION}, ${{ matrix.arch }})"

          # OpenStore's localapikey strategy reads "apikey"
          # from req.body or req.query, not Authorization.
          # The revision route authenticates before multer
          # parses the multipart upload, so use the query string.
          API_QUERY="$(python3 -c \
            'import os, urllib.parse; print(urllib.parse.urlencode({"apikey": os.environ["OPENSTORE_API_KEY"]}))')"

          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST \
            --form "file=@${CLICK}" \
            --form "changelog=Release ${GITHUB_REF_NAME} (${VERSION}, ${{ matrix.arch }})" \
            "https://open-store.io/api/v3/manage/${APP_ID}/revision?${API_QUERY}")"

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::OpenStore upload failed with HTTP ${HTTP_CODE}"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          cat "$RESPONSE_FILE"
          echo "OpenStore upload completed for ${VERSION}/${{ matrix.arch }}"